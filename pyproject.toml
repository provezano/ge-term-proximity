[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ge-term-proximity"
version = "0.1.0"
description = "Grammatical evolution of proximity functions for term networks (GE-TCTN), reimplemented from the 2019 ICMC-USP master's thesis"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Felipe Provezano Coutinho" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ge-tctn = "ge_tctn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
